[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "2.1.4"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "codec"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
json5 = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "gzip", "brotli", "http2"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["std"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
eventsource-stream = "0.2"
axum = { version = "0.8", features = ["ws", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
rusqlite = { version = "0.37", features = ["bundled", "serde_json"] }
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
crossterm = { version = "0.29", features = ["event-stream", "bracketed-paste"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
ignore = "0.4"
globset = "0.4"
similar = "2"
pulldown-cmark = "0.13"
html2md = "0.2"
regex = "1"
rand = "0.9"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
url = "2"
portable-pty = "0.9"
unicode-width = "0.2"
unicode-segmentation = "1"
once_cell = "1"
parking_lot = "0.12"
dashmap = "6"
bytes = "1"
mime_guess = "2"
which = "7"
shell-words = "1"
schemars = "1"
indexmap = { version = "2", features = ["serde"] }

# Debug/test builds: keep file:line for our crates' panics and backtraces, drop full debug info (and all of it for
# dependencies). Every test binary links the whole workspace, so full debug info made target/ grow past 180 GB.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
