[package]
name = "oc-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
oc-util = { path = "../oc-util" }
oc-schema = { path = "../oc-schema" }
oc-storage = { path = "../oc-storage" }
oc-tools = { path = "../oc-tools" }
oc-codemode = { path = "../oc-codemode" }
oc-mcp = { path = "../oc-mcp" }
oc-config = { path = "../oc-config" }
oc-git = { path = "../oc-git" }
oc-ai = { path = "../oc-ai" }
oc-plugin = { path = "../oc-plugin" }
tokio.workspace = true
tokio-util.workspace = true
tokio-stream.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
json5.workspace = true
anyhow.workspace = true
thiserror.workspace = true
async-trait.workspace = true
tracing.workspace = true
reqwest.workspace = true
ignore.workspace = true
globset.workspace = true
similar.workspace = true
regex.workspace = true
chrono.workspace = true
base64.workspace = true
sha2.workspace = true
hex.workspace = true
async-stream = "0.3"
mime_guess.workspace = true
which.workspace = true
shell-words.workspace = true
html2md.workspace = true
portable-pty.workspace = true
parking_lot.workspace = true
dashmap.workspace = true
indexmap.workspace = true
once_cell.workspace = true
url.workspace = true
rand.workspace = true
bytes.workspace = true
rusqlite.workspace = true
uuid = { version = "1", features = ["v4"] }
percent-encoding = "2"
ryu = "1"
notify = "8"
regress = { version = "0.12", features = ["utf16"] }
chrono-tz = { version = "0.10", features = ["case-insensitive"] }

[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
libc = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading"] }

[dev-dependencies]
tokio-tungstenite = "0.29"
tempfile = "3"
axum.workspace = true
parking_lot.workspace = true
reqwest.workspace = true
async-trait.workspace = true
tokio = { workspace = true, features = ["test-util"] }
