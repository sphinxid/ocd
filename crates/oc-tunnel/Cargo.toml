[package]
name = "oc-tunnel"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "OpenTunnel client, wire-compatible with @opentunnel/client 0.6.1 (remote access for pair --remote)"

[features]
# A local stand-in for the OpenTunnel service (HTTP API, bridge WebSocket and public TLS listener), for tests only.
fake = ["dep:axum", "dep:rcgen"]

[dependencies]
oc-util = { path = "../oc-util" }
tokio.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
rustls.workspace = true
chrono.workspace = true
rand.workspace = true
base64.workspace = true
url.workspace = true
parking_lot.workspace = true
bytes.workspace = true
ring = "0.17"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = "0.29"
axum = { workspace = true, optional = true }
rcgen = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"
axum.workspace = true
rcgen.workspace = true

[[example]]
name = "fake_relay"
required-features = ["fake"]

[[example]]
name = "tunnel_probe"
