name: Test

# Runs the workspace tests on the platforms the release builds for but that are not tested day to day (Linux
# x86_64 is). Tests that need the Bun helper, Mercurial or the upstream checkout skip themselves when those are
# missing; every network access in the tests goes to local mock servers.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_VERSION: "1.99.0"
  CARGO_TERM_COLOR: always
  OPENCODE_DISABLE_MODELS_FETCH: "1"

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022, ubuntu-22.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - name: Configure git for tests
        shell: bash
        run: |
          git config --global user.name "ocd tests"
          git config --global user.email "tests@localhost"
          git config --global init.defaultBranch main
      - name: Test
        shell: bash
        run: cargo test --workspace --no-fail-fast --locked
