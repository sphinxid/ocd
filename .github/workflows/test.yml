name: Test

# Runs the workspace tests on the platforms the release builds for but that are not tested day to day (Linux
# x86_64 is). Tests that need the Bun helper, Mercurial or the upstream checkout skip themselves when those are
# missing; every network access in the tests goes to local mock servers.
on:
  push:
    branches: [main, "ci/**"]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes a running test of the same branch.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: "1.99.0"
  CARGO_TERM_COLOR: never
  NO_COLOR: "1"
  OPENCODE_DISABLE_MODELS_FETCH: "1"

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022, ubuntu-22.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - name: Configure git for tests
        shell: bash
        run: |
          git config --global user.name "ocd tests"
          git config --global user.email "tests@localhost"
          git config --global init.defaultBranch main
      - name: Build tests
        shell: bash
        run: cargo test --workspace --no-run --locked
      - name: Install cargo-nextest
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "cargo-nextest.zip"
          Invoke-WebRequest -OutFile $zip https://get.nexte.st/latest/windows
          Expand-Archive -Path $zip -DestinationPath (Join-Path $HOME ".cargo/bin") -Force
      - name: Test
        shell: bash
        run: |
          set +e
          if [ "$RUNNER_OS" = "Windows" ]; then
            # nextest's `ci` profile (.config/nextest.toml) ends a test that runs longer than 4 minutes and names it.
            cargo nextest run --workspace --profile ci --locked --color never 2>&1 | tee test.log
          else
            cargo test --workspace --no-fail-fast --locked 2>&1 | tee test.log
          fi
          exit "${PIPESTATUS[0]}"
      - name: Report failures
        if: failure()
        shell: bash
        # Annotations are readable without access to the logs: failures per test binary, every failing test, then
        # the panics.
        run: bash .github/ci-annotate.sh test.log
